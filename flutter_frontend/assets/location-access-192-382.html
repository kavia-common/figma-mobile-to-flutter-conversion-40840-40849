<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Location Access (192:382)</title>
  <link rel="stylesheet" href="location-access-192-382.css" />
</head>
<body>
  <div id="app">
    <main class="screen location-access" role="main" aria-label="Location Access screen">
      <!-- Top illustration block (rounded rectangle) -->
      <div class="hero-illustration" role="img" aria-label="Location illustration"></div>

      <!-- Access button -->
      <button class="btn-access" id="btnAccess" aria-label="Access location">
        <span class="btn-label">Access LOCATION</span>
        <span class="map-pin">
          <img class="pin-bg" src="/assets/figmaimages/figma_image_192_387.svg" alt="" />
          <img class="pin-vector" src="/assets/figmaimages/figma_image_192_389.svg" alt="" />
        </span>
      </button>

      <!-- Note text -->
      <p class="note" aria-live="polite">
        DFOOD WILL ACCESS YOUR LOCATION ONLY WHILE USING THE APP
      </p>
    </main>
  </div>

  <script src="location-access-192-382.js"></script>
</body>
</html>
