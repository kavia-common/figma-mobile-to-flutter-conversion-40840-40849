<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Personal Profiles (226:318)</title>
  <link rel="stylesheet" href="./personal-profiles-226-318.css" />
</head>
<body>
  <div id="app">
    <!-- Root Frame -->
    <main id="frame-226-318" class="frame personal-profiles" role="main" aria-label="Personal Profiles">
      <!-- Background image of frame if needed (kept transparent; using solid bg via CSS) -->
      <img class="frame-bg" src="./figmaimages/figma_image_226_318.png" alt="" aria-hidden="true" />

      <!-- Top bar group (226:357) -->
      <section id="top-226-357" class="group top">
        <!-- Back button group (226:358 / 226:359) -->
        <button id="back-226-359" class="back-button" aria-label="Back">
          <img class="back-ellipse" src="./figmaimages/figma_image_226_360.svg" alt="" />
          <!-- Left chevron is vector styled via CSS box (no external image path for 226:361) -->
          <span class="back-icon" aria-hidden="true"></span>
        </button>

        <!-- Title: Personal Info (226:362) -->
        <h1 id="title-226-362" class="title">Personal Info</h1>

        <!-- EDIT (226:363) -->
        <button id="edit-226-363" class="edit-button" type="button">EDIT</button>
      </section>

      <!-- Profile group (226:348) -->
      <section id="profile-226-348" class="group profile" aria-label="Profile Header">
        <!-- Profile image holder (100x100) (226:349) -->
        <div id="profile-image-wrap-226-349" class="profile-image-wrap">
          <!-- Rectangle 1223 (226:350) as placeholder box via CSS -->
          <!-- Mask Group container (226:351) containing Rectangle 1293 (226:352). No external image path, using CSS for circle soft color -->
          <div class="profile-avatar" aria-hidden="true"></div>
        </div>

        <!-- Name (226:355) -->
        <div id="profile-name-226-355" class="profile-name">Vishal Khadok</div>

        <!-- Tagline (226:356) -->
        <div id="profile-tagline-226-356" class="profile-tagline">I love fast food</div>
      </section>

      <!-- Personal Info card (226:319) -->
      <section id="card-226-319" class="group info-card" aria-label="Personal Information">
        <!-- Background rounded rectangle 1522 (226:320) drawn via CSS -->

        <!-- Name row (226:339) -->
        <div id="row-name-226-339" class="info-row">
          <!-- Left circle icon holder (226:343 / 226:344 / 226:345-347) -->
          <div class="icon-circle name">
            <!-- composed vectors represented via CSS -->
          </div>
          <div class="label-field">
            <div class="label">FULL NAME</div>
            <div class="field">Vishal Khadok</div>
          </div>
        </div>

        <!-- Email row (226:329) -->
        <div id="row-email-226-329" class="info-row">
          <div class="icon-circle email">
            <!-- boolean operation shapes represented by provided vectors -->
            <img class="email-path-226-336" src="./figmaimages/figma_image_226_336.svg" alt="" aria-hidden="true" />
            <img class="email-path-226-338" src="./figmaimages/figma_image_226_338.svg" alt="" aria-hidden="true" />
          </div>
          <div class="label-field">
            <div class="label">EMAIL</div>
            <div class="field">hello@halallab.co</div>
          </div>
        </div>

        <!-- Phone row (226:321) -->
        <div id="row-phone-226-321" class="info-row">
          <div class="icon-circle phone">
            <img class="phone-ellipse-226-326" src="./figmaimages/figma_image_226_326.svg" alt="" aria-hidden="true" />
            <img class="phone-icon-226-328" src="./figmaimages/figma_image_226_328.svg" alt="" aria-hidden="true" />
          </div>
          <div class="label-field">
            <div class="label">PHONE NUMBER</div>
            <div class="field">408-841-0926</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="./personal-profiles-226-318.js"></script>
</body>
</html>
