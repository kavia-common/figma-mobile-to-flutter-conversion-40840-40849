<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Menu - Screen 38:0</title>
  <link rel="stylesheet" href="./menu-38-0.css" />
</head>
<body>
  <div id="canvas">
    <!-- Background (canvas) -->
    <img class="bg-image" src="/assets/figmaimages/figma_image_38_0.png" alt="Menu screen background reference" />

    <!-- Top bar group (38:38) -->
    <div class="g top" style="left:24px; top:50px; width:327px; height:45px;">
      <!-- Back button -->
      <div class="g back" style="left:0px; top:0px; width:45px; height:45px;">
        <div class="ellipse btn-bg" style="left:0px; top:0px; width:45px; height:45px;"></div>
        <div class="icon back-arrow" style="left:20px; top:17px; width:5px; height:10px;"></div>
      </div>
      <!-- Title -->
      <div class="text title" style="left:61px; top:12px;">Profile</div>
      <!-- More button -->
      <div class="g more" style="left:312px; top:0px; width:45px; height:45px;">
        <img class="ellipse more-ellipse" src="/assets/figmaimages/figma_image_38_40.svg" alt="More button bg" style="left:0px; top:0px; width:45px; height:45px;" />
        <div class="more-dots" style="left:14.409px; top:21.326px; width:16px; height:2px;">
          <span class="dot" style="left:0px;"></span>
          <span class="dot" style="left:7px;"></span>
          <span class="dot" style="left:-7px;"></span>
        </div>
      </div>
    </div>

    <!-- Profile section (137:201) -->
    <div class="g profile" style="left:24px; top:119px; width:272px; height:100px;">
      <div class="g avatar" style="left:0px; top:0px; width:100px; height:100px;">
        <div class="avatar-bg" style="left:0px; top:0px; width:100px; height:100px;"></div>
        <div class="avatar-mask" style="left:0px; top:0px; width:100px; height:100px;"></div>
      </div>
      <div class="text profile-name" style="left:132px; top:22px;">Vishal Khadok</div>
      <div class="text profile-sub" style="left:132px; top:54px;">I love fast food</div>
    </div>

    <!-- Card 1 group (152:25) -->
    <div class="card card-1" style="left:24px; top:251px; width:327px; height:136px;">
      <div class="card-bg"></div>

      <!-- Personal Info row -->
      <div class="row" style="left:20px; top:20px; width:287px; height:40px;">
        <div class="icon-circle soft" style="left:0; top:0;"></div>
        <div class="row-icon person">
          <div class="v v1"></div>
          <div class="v v2"></div>
        </div>
        <div class="row-text">Personal Info</div>
        <div class="chev">
          <div class="chev-v"></div>
        </div>
      </div>

      <!-- Addresses row -->
      <div class="row" style="left:20px; top:76px; width:287px; height:40px;">
        <div class="icon-circle soft" style="left:0; top:0;"></div>
        <div class="row-icon">
          <!-- Use 3-line map icon composed as per YAML -->
          <div class="map v1"></div>
          <div class="map v2"></div>
          <div class="map v3"></div>
        </div>
        <div class="row-text">Addresses</div>
        <div class="chev">
          <div class="chev-v"></div>
        </div>
      </div>
    </div>

    <!-- Card 2 group (152:138) -->
    <div class="card card-2" style="left:24px; top:419px; width:327px; height:248px;">
      <div class="card-bg"></div>

      <!-- Cart -->
      <div class="row" style="left:20px; top:20px; width:287px; height:40px;">
        <div class="icon-circle soft" style="left:0; top:0;"></div>
        <div class="row-icon svg-wrap">
          <img src="/assets/figmaimages/figma_image_152_163.svg" alt="Cart icon" />
        </div>
        <div class="row-text">Cart</div>
        <div class="chev"><div class="chev-v"></div></div>
      </div>

      <!-- Favourite -->
      <div class="row" style="left:20px; top:76px; width:287px; height:40px;">
        <div class="icon-circle soft" style="left:0; top:0;"></div>
        <div class="row-icon svg-wrap">
          <img src="/assets/figmaimages/figma_image_152_161.svg" alt="Favourite icon" />
        </div>
        <div class="row-text">Favourite</div>
        <div class="chev"><div class="chev-v"></div></div>
      </div>

      <!-- Notifications -->
      <div class="row" style="left:20px; top:132px; width:287px; height:40px;">
        <div class="icon-circle soft" style="left:0; top:0;"></div>
        <div class="row-icon svg-wrap">
          <img src="/assets/figmaimages/figma_image_152_174.svg" alt="Notifications icon" />
        </div>
        <div class="row-text">Notifications</div>
        <div class="chev"><div class="chev-v"></div></div>
      </div>

      <!-- Payment Method -->
      <div class="row" style="left:20px; top:188px; width:287px; height:40px;">
        <div class="icon-circle soft" style="left:0; top:0;"></div>
        <div class="row-icon svg-wrap">
          <img src="/assets/figmaimages/figma_image_152_186.svg" alt="Payment method icon" />
        </div>
        <div class="row-text">Payment Method</div>
        <div class="chev"><div class="chev-v"></div></div>
      </div>
    </div>

    <!-- Card 3 group (152:121) -->
    <div class="card card-3" style="left:24px; top:669px; width:327px; height:192px;">
      <div class="card-bg"></div>

      <!-- FAQs -->
      <div class="row" style="left:20px; top:20px; width:287px; height:40px;">
        <div class="icon-circle hard" style="left:0; top:0;"></div>
        <div class="row-icon svg-wrap">
          <img src="/assets/figmaimages/figma_image_152_198.svg" alt="FAQs icon" />
        </div>
        <div class="row-text">FAQs</div>
        <div class="chev"><div class="chev-v"></div></div>
      </div>

      <!-- User Reviews -->
      <div class="row" style="left:20px; top:76px; width:287px; height:40px;">
        <div class="icon-circle hard" style="left:0; top:0;"></div>
        <div class="row-icon svg-wrap">
          <img src="/assets/figmaimages/figma_image_152_194.svg" alt="User reviews star icon" />
        </div>
        <div class="row-text">User Reviews</div>
        <div class="chev"><div class="chev-v"></div></div>
      </div>

      <!-- Settings -->
      <div class="row" style="left:20px; top:132px; width:287px; height:40px;">
        <div class="icon-circle soft" style="left:0; top:0;"></div>
        <div class="row-icon svg-wrap">
          <img src="/assets/figmaimages/figma_image_228_66.svg" alt="Settings icon" />
        </div>
        <div class="row-text">Settings</div>
        <div class="chev"><div class="chev-v"></div></div>
      </div>
    </div>

    <!-- Logout group (152:49) -->
    <div class="card card-logout" style="left:24px; top:873px; width:327px; height:80px;">
      <div class="card-bg"></div>

      <div class="row" style="left:20px; top:20px; width:287px; height:40px;">
        <div class="icon-circle hard" style="left:0; top:0;"></div>
        <div class="row-icon svg-wrap">
          <img src="/assets/figmaimages/figma_image_152_213.svg" alt="Logout icon" />
        </div>
        <div class="row-text">Log Out</div>
        <div class="chev"><div class="chev-v"></div></div>
      </div>
    </div>
  </div>

  <script src="./menu-38-0.js"></script>
</body>
</html>
