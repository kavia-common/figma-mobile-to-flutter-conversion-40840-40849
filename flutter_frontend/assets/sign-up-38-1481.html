<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign Up (38:1481)</title>
  <link rel="stylesheet" href="sign-up-38-1481.css" />
</head>
<body>
  <div class="screen-38-1481" role="application">
    <!-- Top dark header background with patterns -->
    <div class="bg-asset">
      <div class="bg-ellipse"></div>
      <div class="bg-pattern"></div>
    </div>

    <!-- Back button -->
    <button class="back-btn" aria-label="Back">
      <img class="back-ellipse" src="/assets/figmaimages/figma_image_192_458.svg" alt="" />
      <span class="back-arrow"></span>
    </button>

    <!-- Title + Subtitle -->
    <h1 class="title">Sign Up</h1>
    <p class="subtitle">Please sign up to get started</p>

    <!-- White card -->
    <div class="white-card" aria-hidden="true"></div>

    <!-- Form fields - static visual replication -->
    <div class="field-group name-group">
      <label class="label">Name</label>
      <div class="input-rect">
        <span class="input-text">John doe</span>
      </div>
    </div>

    <div class="field-group email-group">
      <label class="label">Email</label>
      <div class="input-rect">
        <span class="input-text">example@gmail.com</span>
      </div>
    </div>

    <div class="field-group password-group">
      <label class="label">Password</label>
      <div class="input-rect">
        <span class="input-text dots">**********</span>
        <span class="eye-off" aria-hidden="true">
          <img src="/assets/figmaimages/figma_image_137_219.svg" alt="" class="eye-outer" />
          <img src="/assets/figmaimages/figma_image_137_218.svg" alt="" class="eye-inner" />
        </span>
      </div>
    </div>

    <div class="field-group retype-group">
      <label class="label">Re-Type Password</label>
      <div class="input-rect">
        <span class="input-text dots">**********</span>
        <span class="eye-off" aria-hidden="true">
          <img src="/assets/figmaimages/figma_image_137_219.svg" alt="" class="eye-outer" />
          <img src="/assets/figmaimages/figma_image_137_218.svg" alt="" class="eye-inner" />
        </span>
      </div>
    </div>

    <!-- CTA Button -->
    <button class="cta-button" type="button">
      <span>Sign Up</span>
    </button>
  </div>

  <script src="sign-up-38-1481.js"></script>
</body>
</html>
