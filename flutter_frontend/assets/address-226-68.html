<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Address</title>
  <link rel="stylesheet" href="./address-226-68.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <button class="back" aria-label="Back">
        <svg width="5" height="10" viewBox="0 0 5 10" aria-hidden="true" focusable="false">
          <path d="M4.5 0.75L1 5l3.5 4.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="title">My Address</h1>
    </header>

    <main class="list">
      <article class="card" data-type="home">
        <div class="badge badge-home" aria-hidden="true">
          <svg class="glyph" width="18" height="20" viewBox="0 0 18 20">
            <path d="M2 8.5l7-6 7 6v9a1 1 0 0 1-1 1h-4v-5H7v5H3a1 1 0 0 1-1-1v-9z" fill="currentColor"/>
          </svg>
        </div>
        <div class="content">
          <h2 class="card-title">Home</h2>
          <p class="address">2464 Royal Ln. Mesa, New Jersey 45463</p>
        </div>
        <div class="actions">
          <button class="icon edit" aria-label="Edit home address">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M10.2 2.3l3.5 3.5-7.6 7.6H2.6V9.9l7.6-7.6z" fill="currentColor"/>
              <path d="M9.5 3l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="icon delete" aria-label="Delete home address">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3 4h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M6 4V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1m-7 0l1 10a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-10H3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M7 7.5v4M9 7.5v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </article>

      <article class="card" data-type="work">
        <div class="badge badge-work" aria-hidden="true">
          <svg class="glyph" width="20" height="18" viewBox="0 0 20 18">
            <path d="M2 7h16v9H2z" fill="currentColor" opacity="0.9"/>
            <path d="M7 2h6a2 2 0 0 1 2 2v3H5V4a2 2 0 0 1 2-2z" fill="currentColor"/>
          </svg>
        </div>
        <div class="content">
          <h2 class="card-title">Work</h2>
          <p class="address">3891 Ranchview Dr. Richardson, California 62639</p>
        </div>
        <div class="actions">
          <button class="icon edit" aria-label="Edit work address">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M10.2 2.3l3.5 3.5-7.6 7.6H2.6V9.9l7.6-7.6z" fill="currentColor"/>
              <path d="M9.5 3l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="icon delete" aria-label="Delete work address">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3 4h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M6 4V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1m-7 0l1 10a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-10H3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M7 7.5v4M9 7.5v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </article>
    </main>

    <footer class="cta">
      <button class="primary" id="addAddressBtn">Add new address</button>
    </footer>
  </div>

  <script src="./address-226-68.js"></script>
</body>
</html>
