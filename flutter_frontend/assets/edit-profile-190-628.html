<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Edit Profile (190:628)</title>
  <link rel="stylesheet" href="edit-profile-190-628.css" />
</head>
<body>
  <div class="screen screen-190-628">
    <!-- Top bar -->
    <div class="group top-190-699" role="banner" aria-label="Top Bar">
      <button class="back-190-700" aria-label="Back">
        <img class="back-ellipse-190-702" src="figmaimages/figma_image_190_702.svg" alt="" />
        <span class="back-icon-190-703"></span>
      </button>
      <h1 class="title-190-704">Edit Profile</h1>
    </div>

    <!-- Profile avatar with edit icon -->
    <div class="group profile-226-678" aria-label="Profile avatar">
      <div class="avatar-bg-226-679"></div>
      <div class="avatar-overlay-226-680">
        <div class="avatar-mask-226-681"></div>
      </div>
      <button class="edit-icon-230-2" aria-label="Edit avatar">
        <img class="edit-ellipse-228-2" src="figmaimages/figma_image_228_2.svg" alt="" />
        <img class="edit-vector-228-4" src="figmaimages/figma_image_228_4.svg" alt="" />
      </button>
    </div>

    <!-- Name field -->
    <div class="field name-190-725">
      <label class="label-190-723">Full Name</label>
      <div class="input-rect-190-716">
        <span class="input-text-190-722">Vishal Khadok</span>
      </div>
    </div>

    <!-- Email field -->
    <div class="field email-190-724">
      <label class="label-190-714">Email</label>
      <div class="input-rect-190-707">
        <span class="input-text-190-713">hello@halallab.co</span>
      </div>
    </div>

    <!-- Phone field -->
    <div class="field phone-190-726">
      <label class="label-190-729">Phone Number</label>
      <div class="input-rect-190-727">
        <span class="input-text-190-728">408-841-0926</span>
      </div>
    </div>

    <!-- Bio multiline -->
    <div class="field bio-223-30">
      <label class="label-223-32">Bio</label>
      <div class="textarea-rect-223-31">
        <span class="textarea-text-223-33">I love fast food</span>
      </div>
    </div>

    <!-- Save button -->
    <button class="button-226-672" type="button">
      <div class="button-bg-190-823"></div>
      <span class="button-text-190-824">Save</span>
    </button>
  </div>

  <script src="edit-profile-190-628.js"></script>
</body>
</html>
