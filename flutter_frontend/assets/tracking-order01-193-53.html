<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tracking Order_01 (193:53)</title>
  <link rel="stylesheet" href="tracking-order01-193-53.css" />
</head>
<body>
  <!-- Root frame 375x812 -->
  <div id="screen-193-53" class="screen">
    <!-- Map background canvas group -->
    <div class="map-canvas" aria-hidden="true">
      <!-- decorative vector layers from YAML that have exported images -->
      <img class="vec img-203-12" src="assets/figmaimages/figma_image_203_12.svg" alt="" />
      <img class="vec img-203-13" src="assets/figmaimages/figma_image_203_13.svg" alt="" />
      <img class="vec img-203-14" src="assets/figmaimages/figma_image_203_14.svg" alt="" />
      <!-- Map route group from 'Track Order' group -->
      <div class="route">
        <!-- main route vector approximated as background stroke via CSS -->
        <div class="route-path"></div>
        <!-- start pin large circle at bottom-left from Ellipse 1334 -->
        <img class="pin-base" src="assets/figmaimages/figma_image_193_139.svg" alt="Current location" />
        <!-- inner pin glyph -->
        <img class="pin-glyph" src="assets/figmaimages/figma_image_193_136.svg" alt="" />
        <!-- destination small dot -->
        <div class="dest-dot"></div>
      </div>
    </div>

    <!-- Top AppBar -->
    <div class="topbar">
      <button class="back-btn" aria-label="Back">
        <img src="assets/figmaimages/figma_image_193_129.svg" class="back-bg" alt="" />
        <span class="back-icon"></span>
      </button>
      <div class="top-title">Track Order</div>
    </div>

    <!-- Bottom sliding card -->
    <section class="bottom-card" role="region" aria-label="Order tracking card">
      <div class="card-rail" aria-hidden="true"></div>

      <!-- Restaurant row -->
      <div class="restaurant">
        <div class="rest-img">
          <div class="rest-img-bg"></div>
          <img src="assets/figmaimages/figma_image_203_400.png" alt="Restaurant cover" class="rest-img-photo" />
        </div>
        <div class="rest-info">
          <div class="rest-name">Uttora Coffee House</div>
          <div class="order-time">Orderd at 06 Sept, 10:00pm</div>
          <div class="items">
            <span class="item">2x Burger</span>
            <span class="item">4x Sanwitch</span>
          </div>
        </div>
      </div>

      <!-- ETA + timeline -->
      <div class="tracking">
        <div class="eta">
          <div class="eta-time">20 min</div>
          <div class="eta-label">Estimated delivery time</div>
        </div>

        <div class="timeline">
          <div class="tl-col tl-col-markers">
            <div class="tl-dot done large">
              <img src="assets/figmaimages/figma_image_203_375.svg" alt="" />
            </div>
            <div class="tl-line tl-line-1"></div>
            <div class="tl-dot inprogress medium">
              <img src="assets/figmaimages/figma_image_203_380.svg" alt="" />
            </div>
            <div class="tl-line tl-line-2"></div>
            <div class="tl-dot todo medium">
              <!-- unfilled outline via CSS -->
            </div>
          </div>
          <div class="tl-col tl-col-text">
            <div class="tl-text tl1">Your order has been received</div>
            <div class="tl-text tl2">The restaurant is preparing your food</div>
            <div class="tl-text tl3">Your order has been picked up for delivery</div>
            <div class="tl-text tl4">Order arriving soon!</div>
          </div>
        </div>
      </div>

      <!-- Contact block -->
      <div class="contact">
        <div class="profile">
          <div class="profile-ring"></div>
          <img src="assets/figmaimages/figma_image_203_352.png" alt="Courier profile" class="profile-photo" />
        </div>
        <div class="contact-text">
          <div class="name">Robert F.</div>
          <div class="role">Courier</div>
        </div>
        <div class="actions">
          <button class="btn call" aria-label="Call courier">
            <img src="assets/figmaimages/figma_image_203_344.svg" alt="" class="call-bg"/>
            <img src="assets/figmaimages/figma_image_203_346.svg" alt="" class="call-icon"/>
          </button>
          <button class="btn chat" aria-label="Chat with courier">
            <span class="chat-bg"></span>
            <img src="assets/figmaimages/figma_image_203_349.svg" alt="" class="chat-icon"/>
          </button>
        </div>
      </div>
    </section>
  </div>

  <script src="tracking-order01-193-53.js"></script>
</body>
</html>
