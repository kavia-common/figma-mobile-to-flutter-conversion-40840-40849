<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0" />
  <title>Food Details_01 (38:1001)</title>
  <link rel="stylesheet" href="food-details01-38-1001.css" />
</head>
<body>
  <div id="screen-38-1001" class="canvas">
    <!-- Top bar -->
    <div id="top-group" class="abs" style="left:0px; top:0px; width:117px; height:45px;">
      <div id="back-btn" class="abs" style="left:0px; top:0px; width:45px; height:45px;">
        <img class="abs" alt="Back button bg" src="assets/figmaimages/figma_image_103_585.svg" style="left:0px; top:0px; width:45px; height:45px;"/>
        <span class="icon-back" style="left:20px; top:17px; width:5px; height:10px;"></span>
      </div>
      <div id="title-text" class="abs text semibold" style="left:61px; top:12px; width:56px; height:22px;">Details</div>
    </div>

    <!-- Heading image block -->
    <div id="heading-image" class="abs" style="left:24px; top:89px; width:327px; height:184px; border-radius:16px; background:#C7CFD9;">
      <!-- Save/Favorite -->
      <img class="abs" alt="Save button bg" src="assets/figmaimages/figma_image_38_1062.svg" style="right:11px; top:127px; width:37px; height:37px;"/>
      <img class="abs" alt="Save heart icon" src="assets/figmaimages/figma_image_38_1063.svg" style="right:19px; top:139px; width:15px; height:13px;"/>
    </div>

    <!-- Vendor pill -->
    <div id="vendor-pill" class="abs" style="left:24px; top:297px; width:201px; height:47px;">
      <div class="vendor-bg"></div>
      <img alt="Vendor avatar" src="assets/figmaimages/figma_image_38_1057.png" class="abs" style="left:20px; top:13px; width:21px; height:21px; border-radius:50%;" />
      <div class="abs text small medium" style="left:73px; top:15px; width:128px; height:17px;">Uttora Coffe House</div>
    </div>

    <!-- Product title -->
    <div id="product-title" class="abs text title" style="left:24px; top:364px; width:235px; height:24px; text-transform:none;">pizza calzone european</div>

    <!-- Product description -->
    <div id="product-desc" class="abs text body" style="left:24px; top:395px; width:307px; height:48px;">
      Prosciutto e funghi is a pizza variety that is topped with tomato sauce.
    </div>

    <!-- Ratings / Free / Time row -->
    <div id="ratings" class="abs" style="left:24px; top:463px; width:53px; height:20px;">
      <img alt="Star" src="assets/figmaimages/figma_image_38_1051.svg" class="abs" style="left:0px; top:0px; width:20px; height:20px;"/>
      <div class="abs text medium" style="left:30px; top:0px; width:23px; height:19px;">4.7</div>
    </div>
    <div id="free-ship" class="abs" style="left:113px; top:465px; width:63px; height:17px;">
      <img alt="Delivery icon" src="assets/figmaimages/figma_image_38_1046.svg" class="abs" style="left:0px; top:0px; width:23px; height:16px;"/>
      <div class="abs text medium" style="left:33px; top:0px; width:30px; height:17px;">Free</div>
    </div>
    <div id="time" class="abs" style="left:188px; top:463px; width:75px; height:20px;">
      <div class="clock-outer"></div>
      <div class="clock-inner"></div>
      <div class="abs text medium" style="left:30px; top:1px; width:45px; height:17px;">20 min</div>
    </div>

    <!-- Size selector -->
    <div id="size-group" class="abs" style="left:24px; top:509px; width:216px; height:48px;">
      <div class="abs text label" style="left:-0px; top:16px; width:36px; height:16px;">Size:</div>
      <!-- 10” -->
      <div class="abs size-pill size-inactive" style="left: -?px;"></div>
    </div>
    <div class="abs size-pill pill-outline" style="left:24px; top:509px; width:48px; height:48px;">
      <div class="abs text pill-text-dark" style="left:12px; top:15px; width:24px; height:19px;">10”</div>
    </div>
    <div class="abs size-pill pill-filled" style="left:82px; top:509px; width:48px; height:48px;">
      <div class="abs text pill-text-light" style="left:13px; top:15px; width:26px; height:19px;">14”</div>
    </div>
    <div class="abs size-pill pill-outline" style="left:140px; top:509px; width:48px; height:48px;">
      <div class="abs text pill-text-dark" style="left:12px; top:15px; width:24px; height:19px;">16”</div>
    </div>

    <!-- Ingredients title -->
    <div id="ingredients-title" class="abs text label" style="left:24px; top:578px; width:85px; height:16px;">ingridents</div>

    <!-- Ingredient grid row 1 -->
    <div class="ingredient" style="left:24px; top:613px;">
      <div class="ing-bg"></div>
      <img src="assets/figmaimages/figma_image_229_350.svg" alt="Salt icon" class="ing-icon"/>
      <div class="ing-name">Salt</div>
    </div>
    <div class="ingredient" style="left:93px; top:613px;">
      <div class="ing-bg"></div>
      <img src="assets/figmaimages/figma_image_229_360.svg" alt="Chicken icon" class="ing-icon"/>
      <div class="ing-name">Chicken</div>
    </div>
    <div class="ingredient tall" style="left:162px; top:613px;">
      <div class="ing-bg"></div>
      <img src="assets/figmaimages/figma_image_229_371.svg" alt="Onion icon" class="ing-icon"/>
      <div class="ing-name two">onion<br/>(Alergy)</div>
    </div>
    <div class="ingredient" style="left:231px; top:613px;">
      <div class="ing-bg"></div>
      <img src="assets/figmaimages/figma_image_229_380.svg" alt="Garlic icon" class="ing-icon"/>
      <div class="ing-name">Garlic</div>
    </div>
    <div class="ingredient tall" style="left:300px; top:613px;">
      <div class="ing-bg"></div>
      <img src="assets/figmaimages/figma_image_229_392.svg" alt="Chili pepper icon" class="ing-icon"/>
      <div class="ing-name two">Pappers<br/>(Alergy)</div>
    </div>

    <!-- Ingredient grid row 2 -->
    <div class="ingredient" style="left:24px; top:712px;">
      <div class="ing-bg"></div>
      <img src="assets/figmaimages/figma_image_229_399.svg" alt="Ginger icon" class="ing-icon"/>
      <div class="ing-name">Ginger</div>
    </div>
    <div class="ingredient" style="left:93px; top:712px;">
      <div class="ing-bg"></div>
      <div class="ing-icon-svg broccoli"></div>
      <div class="ing-name">Broccoli</div>
    </div>
    <div class="ingredient" style="left:162px; top:712px;">
      <div class="ing-bg"></div>
      <div class="ing-icon-svg orange"></div>
      <div class="ing-name">Orange</div>
    </div>
    <div class="ingredient" style="left:231px; top:712px;">
      <div class="ing-bg"></div>
      <div class="ing-icon-svg walnut"></div>
      <div class="ing-name">Walnut</div>
    </div>

    <!-- Bottom add to cart area -->
    <div id="add-cart" class="abs" style="left:0px; top:719px; width:375px; height:184px;">
      <div class="addcart-bg"></div>
      <div class="abs price text price-bold" style="left:24px; top:27px; width:46px; height:34px;">$32</div>

      <div class="abs qty-wrapper" style="left:226px; top:20px; width:125px; height:48px;">
        <div class="qty-bg"></div>
        <div class="abs circle minus" style="left:14px; top:12px;">
          <div class="minus-line"></div>
        </div>
        <div class="abs text qty-number" style="left:61px; top:13px; width:9px; height:19px;">2</div>
        <div class="abs circle plus" style="left:94px; top:12px;">
          <div class="plus-h"></div>
          <div class="plus-v"></div>
        </div>
      </div>

      <button id="add-to-cart-btn" class="abs cta" style="left:24px; top:92px; width:327px; height:62px;">
        Add to cart
      </button>
    </div>
  </div>

  <script src="food-details01-38-1001.js"></script>
</body>
</html>
