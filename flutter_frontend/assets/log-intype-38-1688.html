<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Log In_type (38:1688)</title>
  <link rel="stylesheet" href="log-intype-38-1688.css" />
</head>
<body>
  <div id="screen" class="screen">
    <!-- BG Asset group -->
    <div class="group bg-asset" style="left:-83px; top:-94px; width:552px; height:449px;">
      <!-- Ellipse 1005 (decor) -->
      <div class="ellipse ellipse-1005"></div>
      <!-- Vector 142 (decor ray) -->
      <div class="vector-142"></div>
    </div>

    <!-- Headings -->
    <div class="title" style="left:125px; top:118px; width:99px; height:36px;">Log In</div>
    <div class="subtitle" style="left:42px; top:157px; width:291px; height:26px;">
      Please sign in to your existing account
    </div>

    <!-- White Card -->
    <div class="white-card"></div>

    <!-- Email Group -->
    <div class="group email" style="left:6px; top:257px; width:327px; height:86px;">
      <div class="label" style="left:0px; top:0px; width:43px; height:16px;">Email</div>
      <div class="field" style="left:0px; top:24px; width:327px; height:62px;">
        <div class="field-bg"></div>
        <div class="field-text" style="left:19px; top:23px;">example@gmail.com</div>
      </div>
    </div>

    <!-- Password Group -->
    <div class="group password" style="left:6px; top:367px; width:327px; height:86px;">
      <div class="label" style="left:0px; top:0px; width:70px; height:16px;">Password</div>
      <div class="field" style="left:0px; top:24px; width:327px; height:62px;">
        <div class="field-bg"></div>
        <div class="field-text" style="left:19px; top:24px;">123456789</div>
        <!-- Eye icon group aligned to right -->
        <img class="icon-eye" src="/assets/figmaimages/figma_image_103_169.svg" alt="toggle password visibility" />
      </div>
    </div>

    <!-- Remember + Forgot -->
    <div class="remember" style="left:6px; top:477px; width:119px; height:20px;">
      <img class="checkbox" src="/assets/figmaimages/figma_image_103_147.svg" alt="remember me checkbox" />
      <div class="remember-text">Remember me</div>
    </div>
    <div class="forgot" style="left:226px; top:478px; width:112px; height:17px;">Forgot Password</div>

    <!-- Primary Button -->
    <button id="loginButton" class="primary-btn" style="left:6px; top:526px; width:327px; height:62px;">
      Log In
    </button>

    <!-- Account prompt -->
    <div class="prompt" style="left:49px; top:630px; width:179px; height:24px;">Don’t have an account?</div>
    <div class="signup" style="left:278px; top:634px; width:60px; height:17px;">Sign Up</div>

    <!-- Social Icons group -->
    <div class="group social" style="left:51px; top:681px; width:247px; height:96px;">
      <div class="or" style="left:113px; top:0px; width:19px; height:19px;">Or</div>

      <!-- Facebook -->
      <div class="social-item" style="left:0px; top:34px; width:62px; height:62px;">
        <img class="social-bg" src="/assets/figmaimages/figma_image_103_171.svg" alt="Facebook background" />
        <img class="social-icon" src="/assets/figmaimages/figma_image_223_1574.svg" alt="Facebook icon" />
      </div>

      <!-- Twitter -->
      <div class="social-item" style="left:92px; top:34px; width:62px; height:62px;">
        <!-- Flat filled circle via CSS; icon via SVG -->
        <div class="twitter-bg"></div>
        <img class="social-icon" src="/assets/figmaimages/figma_image_103_177.svg" alt="Twitter icon" />
      </div>

      <!-- Apple -->
      <div class="social-item" style="left:185px; top:34px; width:62px; height:62px;">
        <div class="apple-bg"></div>
        <img class="social-icon" src="/assets/figmaimages/figma_image_103_181.svg" alt="Apple icon" />
      </div>
    </div>
  </div>

  <script src="log-intype-38-1688.js"></script>
</body>
</html>
